<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resta Vertical</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #f0f0f0;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.contenedor {
    background: white;
    padding: 20px;
    display: inline-block;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}

input {
    width: 60px;
    font-size: 24px;
    text-align: center;
    margin: 5px;
}

.resta {
    font-size: 40px;
    margin-top: 20px;
    line-height: 1.2;
}

.linea {
    border-top: 3px solid black;
    width: 100px;
    margin: 5px auto;
}

.resultado {
    font-weight: bold;
}

.paso {
    margin-top: 10px;
    font-size: 16px;
    text-align: left;
}

button {
    margin-top: 10px;
    padding: 8px 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #2196f3;
    color: white;
    cursor: pointer;
}
</style>

</head>
<body>

<h1>🧮 Resta Vertical</h1>

<div class="contenedor">

    <input type="number" id="num1" placeholder="Arriba">
    <input type="number" id="num2" placeholder="Abajo">
    <br>
    <button onclick="calcular()">Resolver</button>

    <div class="resta" id="operacion"></div>

    <div id="pasos"></div>

</div>

<script>
function calcular(){
    let a = document.getElementById("num1").value;
    let b = document.getElementById("num2").value;

    if(a === "" || b === ""){
        alert("Ingresa ambos números");
        return;
    }

    let n1 = parseInt(a);
    let n2 = parseInt(b);

    // mostrar formato vertical
    document.getElementById("operacion").innerHTML = `
        ${n1}<br>
        - ${n2}
        <div class="linea"></div>
        <span class="resultado">${n1 - n2}</span>
    `;

    // explicación paso a paso
    let pasos = "";

    let u1 = n1 % 10;
    let d1 = Math.floor(n1 / 10);

    let u2 = n2 % 10;
    let d2 = Math.floor(n2 / 10);

    pasos += "<div class='paso'><b>📖 Paso a paso:</b><br>";

    pasos += `1️⃣ Unidades: ${u1} - ${u2}<br>`;

    if(u1 < u2){
        pasos += `❌ No se puede → pedimos prestado<br>`;
        u1 += 10;
        d1 -= 1;
        pasos += `Ahora: ${u1} - ${u2} = ${u1 - u2}<br>`;
    } else {
        pasos += `✅ ${u1} - ${u2} = ${u1 - u2}<br>`;
    }

    pasos += `<br>2️⃣ Decenas: ${d1} - ${d2} = ${d1 - d2}<br>`;
    pasos += `<br>🎉 Resultado final: ${n1 - n2}</div>`;

    document.getElementById("pasos").innerHTML = pasos;
}
</script>

</body>
</html>
