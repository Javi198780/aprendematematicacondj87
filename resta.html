<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resta Cuaderno PRO IA</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #eef2f7;
    text-align: center;
}

.caja {
    background: white;
    padding: 20px;
    display: inline-block;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

input {
    width: 80px;
    font-size: 20px;
    text-align: center;
    margin: 5px;
}

button {
    margin-top: 10px;
    padding: 8px 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

.operacion {
    margin-top: 30px;
    font-size: 40px;
}

.fila {
    display: flex;
    justify-content: center;
}

.celda {
    width: 60px;
    height: 80px;
    position: relative;
}

.activa {
    background: #fff3cd;
    border-radius: 5px;
}

.tachado::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 3px;
    background: red;
    transform: rotate(-20deg);
}

.arriba10 {
    position: absolute;
    top: -25px;
    left: 0;
    right: 0;
    font-size: 18px;
    color: blue;
}

.flecha {
    position: absolute;
    top: -40px;
    left: 20px;
    font-size: 25px;
    animation: mover 1s infinite;
}

@keyframes mover {
    0% { transform: translateY(0); }
    50% { transform: translateY(10px); }
    100% { transform: translateY(0); }
}

.linea {
    border-top: 3px solid black;
    width: 180px;
    margin: auto;
}

.resultado {
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🧮 Resta con IA y Animación</h1>

<div class="caja">

<input type="number" id="n1" placeholder="Arriba">
<input type="number" id="n2" placeholder="Abajo">
<br>
<button onclick="animar()">Explicar</button>

<div class="operacion" id="op"></div>

</div>

<script>
function hablar(texto){
    let voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-ES";
    voz.rate = 0.8;
    voz.pitch = 1.2;
    voz.volume = 1;
    speechSynthesis.speak(voz);
}

function animar(){

speechSynthesis.cancel();

let n1 = parseInt(document.getElementById("n1").value);
let n2 = parseInt(document.getElementById("n2").value);

if(n2 > n1){
    alert("El número de arriba debe ser mayor");
    return;
}

let u1 = n1 % 10;
let d1 = Math.floor(n1 / 10) % 10;
let c1 = Math.floor(n1 / 100);

let u2 = n2 % 10;
let d2 = Math.floor(n2 / 10) % 10;
let c2 = Math.floor(n2 / 100);

let op = document.getElementById("op");

op.innerHTML = `
<div class="fila">
<div class="celda" id="c1">${c1}</div>
<div class="celda" id="d1">${d1}</div>
<div class="celda" id="u1">${u1}</div>
</div>

<div class="fila">
<div class="celda">-${c2}</div>
<div class="celda">${d2}</div>
<div class="celda">${u2}</div>
</div>

<div class="linea"></div>
<div class="fila resultado" id="res"></div>
`;

hablar(`Vamos a resolver ${n1} menos ${n2}`);

// UNIDADES
setTimeout(()=>{

let u = document.getElementById("u1");
u.classList.add("activa");

if(u1 < u2){

hablar("Ups... no alcanza 😮, necesitamos ayuda");

let d = document.getElementById("d1");
d.classList.add("tachado");
d.innerHTML += `<div class="flecha">⬇️</div>`;

u.innerHTML += `<div class="arriba10">+10</div>`;

u1 += 10;
d1 -= 1;

setTimeout(()=>{

d.innerText = d1;
u.innerText = u1;

let resU = u1 - u2;

hablar(`Ahora tenemos ${u1} menos ${u2}, eso es ${resU}`);

mostrarResultado(resU, null, null);

},1500);

}else{

let resU = u1 - u2;
hablar(`${u1} menos ${u2} es ${resU}`);
mostrarResultado(resU, null, null);
}

},1500);

// DECENAS
setTimeout(()=>{

let d = document.getElementById("d1");
d.classList.add("activa");

if(d1 < d2){

hablar("La decena necesita ayuda de la centena");

let c = document.getElementById("c1");
c.classList.add("tachado");
c.innerHTML += `<div class="flecha">⬇️</div>`;


d.innerHTML += `<div class="arriba10">+10</div>`;

d1 += 10;
c1 -= 1;

setTimeout(()=>{

c.innerText = c1;
d.innerText = d1;

let resD = d1 - d2;

hablar(`Ahora ${d1} menos ${d2} es ${resD}`);

mostrarResultado(null, resD, null);

},1500);

}else{

let resD = d1 - d2;
hablar(`${d1} menos ${d2} es ${resD}`);
mostrarResultado(null, resD, null);
}

},5000);

// CENTENAS
setTimeout(()=>{

let resC = c1 - c2;
hablar(`${c1} menos ${c2} es ${resC}`);
mostrarResultado(null, null, resC);

},8500);

}

function mostrarResultado(u,d,c){

let res = document.getElementById("res");
let actual = res.innerHTML.split("</div>");

let uHTML = actual[2] || '<div class="celda"></div>';
let dHTML = actual[1] || '<div class="celda"></div>';
let cHTML = actual[0] || '<div class="celda"></div>';

if(u !== null) uHTML = `<div class="celda">${u}</div>`;
if(d !== null) dHTML = `<div class="celda">${d}</div>`;
if(c !== null) cHTML = `<div class="celda">${c}</div>`;

res.innerHTML = cHTML + dHTML + uHTML;
}
</script>

</body>
</html>
