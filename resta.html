<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resta tipo cuaderno PRO</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #eef2f7;
    text-align: center;
}

.caja {
    background: white;
    padding: 20px;
    display: inline-block;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

input {
    width: 80px;
    font-size: 20px;
    text-align: center;
    margin: 5px;
}

button {
    margin-top: 10px;
    padding: 8px 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

.operacion {
    margin-top: 30px;
    font-size: 40px;
}

.fila {
    display: flex;
    justify-content: center;
}

.celda {
    width: 50px;
    height: 70px;
    position: relative;
}

/* tachado */
.tachado {
    position: relative;
}

.tachado::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 3px;
    background: red;
    transform: rotate(-20deg);
}

/* número pequeño arriba (préstamo) */
.arriba10 {
    position: absolute;
    top: -25px;
    left: 0;
    right: 0;
    font-size: 18px;
    color: blue;
    animation: aparecer 0.5s ease-in-out;
}

@keyframes aparecer {
    from { opacity: 0; transform: translateY(-10px);}
    to { opacity: 1; transform: translateY(0);}
}

.linea {
    border-top: 3px solid black;
    width: 160px;
    margin: auto;
}

.resultado {
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🧮 Resta tipo cuaderno PRO</h1>

<div class="caja">

    <input type="number" id="n1" placeholder="Arriba">
    <input type="number" id="n2" placeholder="Abajo">
    <br>
    <button onclick="animar()">Explicar</button>

    <div class="operacion" id="op"></div>

</div>

<script>
function hablar(texto){
    let voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-ES";
    voz.rate = 0.9;
    speechSynthesis.speak(voz);
}

function animar(){

    speechSynthesis.cancel();

    let n1 = parseInt(document.getElementById("n1").value);
    let n2 = parseInt(document.getElementById("n2").value);

    if(isNaN(n1) || isNaN(n2)){
        alert("Ingresa números");
        return;
    }

    let u1 = n1 % 10;
    let d1 = Math.floor(n1 / 10) % 10;
    let c1 = Math.floor(n1 / 100);

    let u2 = n2 % 10;
    let d2 = Math.floor(n2 / 10) % 10;
    let c2 = Math.floor(n2 / 100);

    let op = document.getElementById("op");

    op.innerHTML = `
        <div class="fila">
            <div class="celda" id="c1">${c1}</div>
            <div class="celda" id="d1">${d1}</div>
            <div class="celda" id="u1">${u1}</div>
        </div>

        <div class="fila">
            <div class="celda">-${c2}</div>
            <div class="celda">${d2}</div>
            <div class="celda">${u2}</div>
        </div>

        <div class="linea"></div>
    `;

    hablar(`Vamos a resolver ${n1} menos ${n2}`);

    // 🔴 UNIDADES
    setTimeout(()=>{

        hablar(`Primero restamos las unidades: ${u1} menos ${u2}`);

        if(u1 < u2){

            hablar(`Como ${u1} es menor que ${u2}, no se puede restar`);

            hablar("Pedimos prestado una decena");

            document.getElementById("d1").classList.add("tachado");
            document.getElementById("u1").innerHTML += `<div class="arriba10">10</div>`;

            let nuevaDecena = d1 - 1;
            let nuevaUnidad = u1 + 10;

            setTimeout(()=>{

                document.getElementById("d1").innerText = nuevaDecena;
                document.getElementById("u1").innerText = nuevaUnidad;

                hablar(`La decena se reduce a ${nuevaDecena}`);
                hablar(`Y la unidad se convierte en ${nuevaUnidad}`);

                let resultadoU = nuevaUnidad - u2;

                hablar(`Ahora sí podemos restar: ${nuevaUnidad} menos ${u2} es igual a ${resultadoU}`);

            },1200);

            d1 = nuevaDecena;
            u1 = nuevaUnidad;

        } else {

            let resultadoU = u1 - u2;
            hablar(`Resultado de unidades: ${resultadoU}`);
        }

    },1000);

    // 🔴 DECENAS
    setTimeout(()=>{

        hablar(`Ahora restamos las decenas: ${d1} menos ${d2}`);

        if(d1 < d2){

            hablar(`Como ${d1} es menor que ${d2}, pedimos prestado de las centenas`);

            document.getElementById("c1").classList.add("tachado");
            document.getElementById("d1").innerHTML += `<div class="arriba10">10</div>`;

            let nuevaCentena = c1 - 1;
            let nuevaDecena = d1 + 10;

            setTimeout(()=>{

                document.getElementById("c1").innerText = nuevaCentena;
                document.getElementById("d1").innerText = nuevaDecena;

                hablar(`La centena baja a ${nuevaCentena}`);
                hablar(`La decena se convierte en ${nuevaDecena}`);

                let resultadoD = nuevaDecena - d2;

                hablar(`Entonces: ${nuevaDecena} menos ${d2} es igual a ${resultadoD}`);

            },1200);

            c1 = nuevaCentena;
            d1 = nuevaDecena;

        } else {

            let resultadoD = d1 - d2;
            hablar(`Resultado de decenas: ${resultadoD}`);
        }

    },4500);

    // 🔴 CENTENAS
    setTimeout(()=>{

        let resultadoC = c1 - c2;
        hablar(`Finalmente, restamos las centenas: ${c1} menos ${c2} es igual a ${resultadoC}`);

    },7500);

    // 🔴 RESULTADO FINAL
    setTimeout(()=>{

        let resultado = n1 - n2;

        let u = resultado % 10;
        let d = Math.floor(resultado / 10) % 10;
        let c = Math.floor(resultado / 100);

        op.innerHTML += `
            <div class="fila resultado">
                <div class="celda">${c}</div>
                <div class="celda">${d}</div>
                <div class="celda">${u}</div>
            </div>
        `;

        hablar(`El resultado final es ${resultado}`);

    },10000);
}
</script>
</body>
</html>
