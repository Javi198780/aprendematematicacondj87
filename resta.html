<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resta Cuaderno PRO IA Mejorado</title>

<style>
body {
    font-family: 'Courier New', monospace;
    background: #eef2f7;
    text-align: center;
}

.caja {
    background: white;
    padding: 20px;
    display: inline-block;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

input {
    width: 80px;
    font-size: 20px;
    text-align: center;
    margin: 5px;
}

button {
    margin-top: 10px;
    padding: 8px 15px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

.operacion {
    margin-top: 30px;
    font-size: 40px;
}

.fila {
    display: flex;
    justify-content: center;
}

.celda {
    width: 60px;
    height: 80px;
    position: relative;
}

.activa {
    background: #fff3cd;
    border-radius: 5px;
}

.tachado::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 3px;
    background: red;
    transform: rotate(-20deg);
}

.arriba10 {
    position: absolute;
    top: -25px;
    left: 0;
    right: 0;
    font-size: 18px;
    color: blue;
}

.flecha {
    position: absolute;
    top: -40px;
    left: 20px;
    font-size: 25px;
    animation: mover 1s infinite;
}

@keyframes mover {
    0% { transform: translateY(0); }
    50% { transform: translateY(10px); }
    100% { transform: translateY(0); }
}

.linea {
    border-top: 3px solid black;
    width: 180px;
    margin: auto;
}

.resultado {
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🧮 Resta explicada paso a paso</h1>

<div class="caja">

<input type="number" id="n1" placeholder="Arriba">
<input type="number" id="n2" placeholder="Abajo">
<br>
<button onclick="animar()">Explicar</button>

<div class="operacion" id="op"></div>

</div>

<script>

function hablar(texto){
    let voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-ES";
    voz.rate = 0.75;
    voz.pitch = 1;
    voz.volume = 1;
    speechSynthesis.speak(voz);
}

function animar(){

speechSynthesis.cancel();

let n1 = parseInt(document.getElementById("n1").value);
let n2 = parseInt(document.getElementById("n2").value);

if(isNaN(n1) || isNaN(n2)){
    alert("Ingresa los números");
    return;
}

if(n2 > n1){
    alert("El número de arriba debe ser mayor");
    return;
}

let u1 = n1 % 10;
let d1 = Math.floor(n1 / 10) % 10;
let c1 = Math.floor(n1 / 100);

let u2 = n2 % 10;
let d2 = Math.floor(n2 / 10) % 10;
let c2 = Math.floor(n2 / 100);

let resU = 0, resD = 0, resC = 0;

let op = document.getElementById("op");

op.innerHTML = `
<div class="fila">
<div class="celda" id="c1">${c1}</div>
<div class="celda" id="d1">${d1}</div>
<div class="celda" id="u1">${u1}</div>
</div>

<div class="fila">
<div class="celda">-${c2}</div>
<div class="celda">${d2}</div>
<div class="celda">${u2}</div>
</div>

<div class="linea"></div>
<div class="fila resultado" id="res"></div>
`;

hablar(`Muy bien, vamos a resolver la resta ${n1} menos ${n2}.`);

// UNIDADES
setTimeout(()=>{

hablar("Primero trabajamos con las unidades.");

if(u1 < u2){

hablar(`Como ${u1} es menor que ${u2}, no podemos restar directamente.`);

hablar("Entonces pedimos prestada una decena.");

u1 += 10;
d1 -= 1;

}

resU = u1 - u2;

hablar(`Ahora sí: ${u1} menos ${u2} es igual a ${resU}.`);

mostrarResultado();

},1500);

// DECENAS
setTimeout(()=>{

hablar("Ahora continuamos con las decenas.");

if(d1 < d2){

hablar(`Como ${d1} es menor que ${d2}, pedimos prestada una centena.`);

d1 += 10;
c1 -= 1;

}

resD = d1 - d2;

hablar(`Entonces: ${d1} menos ${d2} es igual a ${resD}.`);

mostrarResultado();

},5000);

// CENTENAS
setTimeout(()=>{

hablar("Finalmente trabajamos con las centenas.");

resC = c1 - c2;

hablar(`Tenemos: ${c1} menos ${c2} es igual a ${resC}.`);

mostrarResultado();

},8000);

// RESULTADO FINAL
setTimeout(()=>{

let resultado = (resC * 100) + (resD * 10) + resU;

hablar(`Por lo tanto, el resultado final es ${resultado}.`);

},11000);

function mostrarResultado(){
    document.getElementById("res").innerHTML = `
        <div class="celda">${resC || ""}</div>
        <div class="celda">${resD || ""}</div>
        <div class="celda">${resU || ""}</div>
    `;
}

}

</script>

</body>
</html>
