<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría Visual para Niños</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#d4fc79,#96e6a1);
text-align:center;
padding:20px;
}

.container{
background:white;
width:700px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

select,input,button{
padding:10px;
margin:8px;
font-size:16px;
border-radius:8px;
}

button{
background:#27ae60;
color:white;
border:none;
cursor:pointer;
}

canvas{
border:2px solid #ccc;
border-radius:10px;
margin-top:15px;
}

.proceso{
background:#f4f6f7;
padding:15px;
margin-top:15px;
border-radius:10px;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>📐 Aprendamos Geometría</h1>

<p>Selecciona una figura</p>

<select id="figura" onchange="cambiarFigura()">

<option value="">Seleccionar</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="circulo">Círculo</option>

</select>

<div id="campos"></div>

<canvas id="canvas" width="450" height="250"></canvas>

<br>

<button onclick="calcular()">Calcular Área</button>

<div class="proceso" id="proceso"></div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function cambiarFigura(){

let figura=document.getElementById("figura").value;

limpiar();

if(figura=="cuadrado"){

document.getElementById("campos").innerHTML=
"Lado: <input type='number' id='lado'>";

}

if(figura=="rectangulo"){

document.getElementById("campos").innerHTML=
"Base: <input type='number' id='base'><br>Altura: <input type='number' id='altura'>";

}

if(figura=="circulo"){

document.getElementById("campos").innerHTML=
"Radio: <input type='number' id='radio'>";

}

}

function calcular(){

let figura=document.getElementById("figura").value;

limpiar();

let texto="";

if(figura=="cuadrado"){

let lado=parseFloat(document.getElementById("lado").value);

ctx.fillStyle="#3498db";
ctx.fillRect(170,60,100,100);

ctx.fillStyle="black";
ctx.fillText("Lado = "+lado,180,50);

let area=lado*lado;

texto+="Paso 1: Área = lado × lado <br>";
texto+="Paso 2: Área = "+lado+" × "+lado+"<br>";
texto+="Paso 3: Área = "+area+"<br><br>";
texto+="⭐ ¡Excelente trabajo!";

}

if(figura=="rectangulo"){

let base=parseFloat(document.getElementById("base").value);
let altura=parseFloat(document.getElementById("altura").value);

ctx.fillStyle="#9b59b6";
ctx.fillRect(140,80,180,90);

ctx.fillStyle="black";
ctx.fillText("Base = "+base,190,70);
ctx.fillText("Altura = "+altura,330,120);

let area=base*altura;

texto+="Paso 1: Área = base × altura <br>";
texto+="Paso 2: Área = "+base+" × "+altura+"<br>";
texto+="Paso 3: Área = "+area+"<br><br>";
texto+="⭐ ¡Muy bien!";

}

if(figura=="circulo"){

let r=parseFloat(document.getElementById("radio").value);

ctx.fillStyle="#f1c40f";

ctx.beginPath();
ctx.arc(220,120,60,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="black";
ctx.fillText("Radio = "+r,210,40);

let area=Math.PI*r*r;

texto+="Paso 1: Área = π × radio² <br>";
texto+="Paso 2: Área = 3.14 × "+r+"²<br>";
texto+="Paso 3: Área = "+area.toFixed(2)+"<br><br>";
texto+="⭐ ¡Genial!";

}

document.getElementById("proceso").innerHTML=texto;

}

</script>

</body>
</html>
