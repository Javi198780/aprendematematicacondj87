<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría Interactiva</title>

<style>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría para Niños</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#84fab0,#8fd3f4);
text-align:center;
padding:20px;
}

.container{
background:white;
width:850px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

select,input,button{
padding:8px;
margin:6px;
font-size:16px;
}

canvas{
border:2px solid #ccc;
margin-top:10px;
border-radius:10px;
}

.proceso{
background:#f4f6f7;
padding:15px;
margin-top:15px;
border-radius:10px;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>📐 Geometría Interactiva</h1>

<select id="figura" onchange="cambiarFigura()">

<option value="">Seleccionar figura</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="triangulo">Triángulo</option>
<option value="rombo">Rombo</option>
<option value="trapecio">Trapecio</option>
<option value="pentagono">Pentágono</option>
<option value="hexagono">Hexágono</option>
<option value="circulo">Círculo</option>

</select>

<select id="unidad">
<option value="cm">cm</option>
<option value="m">m</option>
</select>

<div id="campos"></div>

<canvas id="canvas" width="500" height="300"></canvas>

<br>

<button onclick="calcular()">Calcular</button>

<div id="proceso" class="proceso"></div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function cambiarFigura(){

let f=document.getElementById("figura").value;

limpiar();

if(f=="cuadrado")
document.getElementById("campos").innerHTML="Lado <input id='lado'>";

if(f=="rectangulo")
document.getElementById("campos").innerHTML="Base <input id='base'> Altura <input id='altura'>";

if(f=="triangulo")
document.getElementById("campos").innerHTML="Base <input id='base'> Altura <input id='altura'>";

if(f=="rombo")
document.getElementById("campos").innerHTML="Diagonal mayor <input id='D'> Diagonal menor <input id='d'>";

if(f=="trapecio")
document.getElementById("campos").innerHTML="Base mayor <input id='B'> Base menor <input id='b'> Altura <input id='h'>";

if(f=="pentagono")
document.getElementById("campos").innerHTML="Lado <input id='lado'> Apotema <input id='apo'>";

if(f=="hexagono")
document.getElementById("campos").innerHTML="Lado <input id='lado'> Apotema <input id='apo'>";

if(f=="circulo")
document.getElementById("campos").innerHTML="Radio <input id='r'>";

}

function calcular(){

let f=document.getElementById("figura").value;
let unidad=document.getElementById("unidad").value;

limpiar();

let texto="";

if(f=="cuadrado"){

let l=parseFloat(document.getElementById("lado").value);

ctx.strokeRect(200,100,120,120);

ctx.fillText("lado "+l+" "+unidad,210,240);

let area=l*l;

texto="Área = lado × lado<br>";
texto+=l+" × "+l+" = "+area+" "+unidad+"²";

}

if(f=="rectangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.strokeRect(170,110,180,100);

ctx.fillText("Base "+b+" "+unidad,230,230);
ctx.fillText("Altura "+h+" "+unidad,360,160);

let area=b*h;

texto="Área = base × altura<br>";
texto+=b+" × "+h+" = "+area+" "+unidad+"²";

}

if(f=="triangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.beginPath();
ctx.moveTo(200,220);
ctx.lineTo(360,220);
ctx.lineTo(280,100);
ctx.closePath();
ctx.stroke();

ctx.fillText("Base "+b+" "+unidad,260,240);
ctx.fillText("Altura "+h+" "+unidad,370,160);

let area=b*h/2;

texto="Área = (base × altura) /2<br>";
texto="("+b+" × "+h+") /2 = "+area+" "+unidad+"²";

}

if(f=="circulo"){

let r=parseFloat(document.getElementById("r").value);

ctx.beginPath();
ctx.arc(280,150,70,0,Math.PI*2);
ctx.stroke();

ctx.fillText("Radio "+r+" "+unidad,260,60);

let area=Math.PI*r*r;

texto="Área = π × radio²<br>";
texto="3.14 × "+r+"² = "+area.toFixed(2)+" "+unidad+"²";

}

if(f=="pentagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apo").value);

let area=(5*l*a)/2;

ctx.beginPath();
ctx.moveTo(280,80);
ctx.lineTo(350,140);
ctx.lineTo(320,220);
ctx.lineTo(240,220);
ctx.lineTo(210,140);
ctx.closePath();
ctx.stroke();

texto="Área = (Perímetro × apotema)/2<br>";
texto="Perímetro = 5 × "+l+" = "+(5*l)+"<br>";
texto="Área = ("+(5*l)+" × "+a+")/2 = "+area+" "+unidad+"²";

}

if(f=="hexagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apo").value);

let area=(6*l*a)/2;

ctx.beginPath();
ctx.moveTo(280,80);
ctx.lineTo(360,130);
ctx.lineTo(360,200);
ctx.lineTo(280,250);
ctx.lineTo(200,200);
ctx.lineTo(200,130);
ctx.closePath();
ctx.stroke();

texto="Área = (Perímetro × apotema)/2<br>";
texto="Perímetro = 6 × "+l+" = "+(6*l)+"<br>";
texto="Área = ("+(6*l)+" × "+a+")/2 = "+area+" "+unidad+"²";

}

document.getElementById("proceso").innerHTML=texto;

}

</script>

</body>
</html>
