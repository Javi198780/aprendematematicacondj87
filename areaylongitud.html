<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Geometría</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#89f7fe,#66a6ff);
text-align:center;
padding:20px;
}

.container{
background:white;
width:700px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

h1{
color:#2c3e50;
}

select,input,button{
padding:10px;
margin:8px;
font-size:16px;
border-radius:8px;
}

button{
background:#27ae60;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1e8449;
}

canvas{
border:2px solid #ccc;
border-radius:10px;
margin-top:10px;
}

.resultado{
font-size:20px;
margin-top:10px;
font-weight:bold;
}

.puntos{
font-size:22px;
color:#e67e22;
margin-top:10px;
}

.juego{
margin-top:20px;
padding:15px;
background:#f7f9fb;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>📐 Juego de Geometría</h1>

<p><b>Calculadora de Figuras</b></p>

<select id="figura" onchange="dibujar()">

<option value="">Seleccionar</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="circulo">Círculo</option>

</select>

<div id="campos"></div>

<canvas id="canvas" width="400" height="250"></canvas>

<br>

<button onclick="calcular()">Calcular</button>

<div class="resultado" id="resultado"></div>

<hr>

<div class="juego">

<h2>🎮 Modo Juego</h2>

<p id="pregunta"></p>

<input type="number" id="respuesta" placeholder="Tu respuesta">

<br>

<button onclick="verificar()">Responder</button>

<div class="resultado" id="resultadoJuego"></div>

<div class="puntos">⭐ Puntos: <span id="puntos">0</span></div>

</div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

let puntos=0;
let respuestaCorrecta=0;

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function dibujar(){

let figura=document.getElementById("figura").value;

limpiar();

if(figura=="cuadrado"){

document.getElementById("campos").innerHTML=
"Lado: <input type='number' id='lado'>";

ctx.fillStyle="#3498db";
ctx.fillRect(150,60,100,100);

}

if(figura=="rectangulo"){

document.getElementById("campos").innerHTML=
"Base: <input type='number' id='base'><br>Altura: <input type='number' id='altura'>";

ctx.fillStyle="#9b59b6";
ctx.fillRect(120,80,160,90);

}

if(figura=="circulo"){

document.getElementById("campos").innerHTML=
"Radio: <input type='number' id='radio'>";

ctx.fillStyle="#f1c40f";

ctx.beginPath();
ctx.arc(200,120,60,0,Math.PI*2);
ctx.fill();

}

}

function calcular(){

let figura=document.getElementById("figura").value;

let area=0;
let perimetro=0;

if(figura=="cuadrado"){

let lado=parseFloat(document.getElementById("lado").value);

area=lado*lado;
perimetro=4*lado;

}

if(figura=="rectangulo"){

let base=parseFloat(document.getElementById("base").value);
let altura=parseFloat(document.getElementById("altura").value);

area=base*altura;
perimetro=2*(base+altura);

}

if(figura=="circulo"){

let r=parseFloat(document.getElementById("radio").value);

area=Math.PI*r*r;
perimetro=2*Math.PI*r;

}

document.getElementById("resultado").innerHTML=
"Área = "+area.toFixed(2)+" | Perímetro = "+perimetro.toFixed(2);

}

function nuevaPregunta(){

let tipo=Math.floor(Math.random()*2);

if(tipo==0){

let lado=Math.floor(Math.random()*10)+1;

respuestaCorrecta=lado*lado;

document.getElementById("pregunta").innerHTML=
"¿Cuál es el área de un cuadrado con lado "+lado+" ?";

}

else{

let base=Math.floor(Math.random()*10)+1;
let altura=Math.floor(Math.random()*10)+1;

respuestaCorrecta=base*altura;

document.getElementById("pregunta").innerHTML=
"¿Cuál es el área de un rectángulo con base "+base+" y altura "+altura+" ?";

}

}

function verificar(){

let r=parseFloat(document.getElementById("respuesta").value);

if(r==respuestaCorrecta){

puntos++;

document.getElementById("resultadoJuego").innerHTML=
"✅ ¡Correcto!";

}

else{

document.getElementById("resultadoJuego").innerHTML=
"❌ Incorrecto. La respuesta era "+respuestaCorrecta;

}

document.getElementById("puntos").innerHTML=puntos;

document.getElementById("respuesta").value="";

nuevaPregunta();

}

nuevaPregunta();

</script>

</body>
</html>
