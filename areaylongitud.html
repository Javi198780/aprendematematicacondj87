<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría para Niños</title>

<style>

body{
font-family:Arial;
background:linear-gradient(120deg,#a1c4fd,#c2e9fb);
text-align:center;
padding:20px;
}

.container{
background:white;
width:950px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

select,input,button{
padding:8px;
margin:6px;
font-size:16px;
border-radius:6px;
}

button{
background:#27ae60;
color:white;
border:none;
cursor:pointer;
font-size:18px;
}

canvas{
border:2px solid #ccc;
margin-top:15px;
border-radius:10px;
}

.resultados{
display:flex;
justify-content:space-around;
margin-top:20px;
}

.tarjeta{
background:#f4f6f7;
padding:15px;
border-radius:10px;
width:40%;
font-size:17px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.proceso{
margin-top:20px;
background:#ecf0f1;
padding:15px;
border-radius:10px;
font-size:17px;
}

</style>
</head>

<body>

<div class="container">

<h1>📐 Geometría Interactiva</h1>

Figura

<select id="figura" onchange="camposFigura()">

<option value="">Seleccionar</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="circulo">Círculo</option>
<option value="triangulo">Triángulo</option>
<option value="rombo">Rombo</option>
<option value="trapecio">Trapecio</option>
<option value="pentagono">Pentágono</option>
<option value="hexagono">Hexágono</option>

</select>

Unidad

<select id="unidad">
<option value="cm">Centímetros</option>
<option value="m">Metros</option>
</select>

<div id="campos"></div>

<canvas id="canvas" width="600" height="350"></canvas>

<br>

<button onclick="calcular()">Calcular</button>

<div class="resultados">

<div class="tarjeta">
<h3>Área</h3>
<div id="areaResultado">-</div>
</div>

<div class="tarjeta">
<h3>Perímetro / Longitud</h3>
<div id="periResultado">-</div>
</div>

</div>

<div id="proceso" class="proceso"></div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function camposFigura(){

let f=document.getElementById("figura").value;
let html="";

if(f=="cuadrado")
html="Lado <input id='lado' type='number'>";

if(f=="rectangulo")
html="Base <input id='base' type='number'> Altura <input id='altura' type='number'>";

if(f=="circulo")
html="Radio <input id='radio' type='number'>";

if(f=="triangulo")
html="Base <input id='base' type='number'> Altura <input id='altura' type='number'>";

if(f=="rombo")
html="Diagonal mayor <input id='D' type='number'> Diagonal menor <input id='d' type='number'>";

if(f=="trapecio")
html="Base mayor <input id='B' type='number'> Base menor <input id='b' type='number'> Altura <input id='h' type='number'>";

if(f=="pentagono")
html="Lado <input id='lado' type='number'> Apotema <input id='apotema' type='number'>";

if(f=="hexagono")
html="Lado <input id='lado' type='number'> Apotema <input id='apotema' type='number'>";

document.getElementById("campos").innerHTML=html;

limpiar();

}

function calcular(){

limpiar();

let f=document.getElementById("figura").value;
let unidad=document.getElementById("unidad").value;

let area=0;
let peri=0;

let textoArea="";
let textoPeri="";

ctx.font="16px Arial";

if(f=="cuadrado"){

let l=parseFloat(document.getElementById("lado").value);

ctx.strokeRect(250,100,120,120);

area=l*l;
peri=4*l;

textoArea="Área = lado × lado <br>"+l+" × "+l+" = "+area+" "+unidad+"²";

textoPeri="Perímetro = 4 × lado <br>4 × "+l+" = "+peri+" "+unidad;

}

if(f=="rectangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.strokeRect(200,110,200,120);

area=b*h;
peri=2*(b+h);

textoArea="Área = base × altura <br>"+b+" × "+h+" = "+area+" "+unidad+"²";

textoPeri="Perímetro = 2 × (b + h)<br>2 × ("+b+" + "+h+") = "+peri+" "+unidad;

}

if(f=="circulo"){

let r=parseFloat(document.getElementById("radio").value);

ctx.beginPath();
ctx.arc(300,170,80,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(300,170);
ctx.lineTo(380,170);
ctx.stroke();

area=Math.PI*r*r;
peri=2*Math.PI*r;

textoArea="Área = π × r² <br>3.14 × "+r+"² = "+area.toFixed(2)+" "+unidad+"²";

textoPeri="Longitud = 2 × π × r <br>2 × 3.14 × "+r+" = "+peri.toFixed(2)+" "+unidad;

}

if(f=="triangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.beginPath();
ctx.moveTo(300,80);
ctx.lineTo(180,250);
ctx.lineTo(420,250);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(300,250);
ctx.lineTo(300,80);
ctx.stroke();

area=(b*h)/2;

textoArea="Área = (b × h) / 2 <br>("+b+" × "+h+") / 2 = "+area+" "+unidad+"²";

textoPeri="Perímetro = suma de sus lados";

}

if(f=="rombo"){

let D=parseFloat(document.getElementById("D").value);
let d=parseFloat(document.getElementById("d").value);

ctx.beginPath();
ctx.moveTo(300,60);
ctx.lineTo(420,170);
ctx.lineTo(300,280);
ctx.lineTo(180,170);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(300,60);
ctx.lineTo(300,280);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(180,170);
ctx.lineTo(420,170);
ctx.stroke();

area=(D*d)/2;

textoArea="Área = (D × d) / 2 <br>("+D+" × "+d+") / 2 = "+area+" "+unidad+"²";

textoPeri="Perímetro = 4 × lado";

}

if(f=="trapecio"){

let B=parseFloat(document.getElementById("B").value);
let b=parseFloat(document.getElementById("b").value);
let h=parseFloat(document.getElementById("h").value);

ctx.beginPath();
ctx.moveTo(200,250);
ctx.lineTo(400,250);
ctx.lineTo(360,120);
ctx.lineTo(240,120);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(300,250);
ctx.lineTo(300,120);
ctx.stroke();

area=((B+b)*h)/2;

textoArea="Área = (B + b) × h / 2 <br>("+B+" + "+b+") × "+h+" / 2 = "+area+" "+unidad+"²";

textoPeri="Perímetro = suma de sus lados";

}

if(f=="pentagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apotema").value);

peri=5*l;
area=(peri*a)/2;

ctx.beginPath();
ctx.moveTo(300,70);
ctx.lineTo(400,150);
ctx.lineTo(360,280);
ctx.lineTo(240,280);
ctx.lineTo(200,150);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(300,190);
ctx.lineTo(300,140);
ctx.stroke();

textoArea="Perímetro = 5 × lado <br>5 × "+l+" = "+peri+"<br><br>";
textoArea+="Área = (P × a) / 2 <br>("+peri+" × "+a+") / 2 = "+area+" "+unidad+"²";

textoPeri="Perímetro = "+peri+" "+unidad;

}

if(f=="hexagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apotema").value);

peri=6*l;
area=(peri*a)/2;

ctx.beginPath();
ctx.moveTo(300,70);
ctx.lineTo(420,150);
ctx.lineTo(420,250);
ctx.lineTo(300,310);
ctx.lineTo(180,250);
ctx.lineTo(180,150);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(300,200);
ctx.lineTo(300,140);
ctx.stroke();

textoArea="Perímetro = 6 × lado <br>6 × "+l+" = "+peri+"<br><br>";
textoArea+="Área = (P × a) / 2 <br>("+peri+" × "+a+") / 2 = "+area+" "+unidad+"²";

textoPeri="Perímetro = "+peri+" "+unidad;

}

document.getElementById("areaResultado").innerHTML=textoArea;
document.getElementById("periResultado").innerHTML=textoPeri;

}

</script>

</body>
</html>
