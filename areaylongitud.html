<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría Divertida</title>

<style>

body{
font-family:Arial;
background:linear-gradient(120deg,#a1c4fd,#c2e9fb);
text-align:center;
padding:20px;
}

.container{
background:white;
width:900px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

select,input,button{
padding:8px;
margin:6px;
font-size:16px;
border-radius:6px;
}

button{
background:#27ae60;
color:white;
border:none;
cursor:pointer;
font-size:18px;
}

canvas{
border:2px solid #ccc;
margin-top:15px;
border-radius:10px;
}

.resultados{
display:flex;
justify-content:space-around;
margin-top:20px;
}

.tarjeta{
background:#f4f6f7;
padding:15px;
border-radius:10px;
width:40%;
font-size:18px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.proceso{
margin-top:20px;
background:#ecf0f1;
padding:15px;
border-radius:10px;
font-size:17px;
}

</style>
</head>

<body>

<div class="container">

<h1>📐 Geometría para Niños</h1>

Figura

<select id="figura" onchange="camposFigura()">

<option value="">Seleccionar</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="circulo">Círculo</option>
<option value="triangulo">Triángulo</option>
<option value="rombo">Rombo</option>
<option value="trapecio">Trapecio</option>
<option value="pentagono">Pentágono</option>
<option value="hexagono">Hexágono</option>

</select>

Unidad

<select id="unidad">
<option value="cm">Centímetros</option>
<option value="m">Metros</option>
</select>

<div id="campos"></div>

<canvas id="canvas" width="550" height="320"></canvas>

<br>

<button onclick="calcular()">Calcular</button>

<div class="resultados">

<div class="tarjeta">
<b>Área</b>
<div id="areaResultado">-</div>
</div>

<div class="tarjeta">
<b>Perímetro / Longitud</b>
<div id="periResultado">-</div>
</div>

</div>

<div id="proceso" class="proceso"></div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function camposFigura(){

let f=document.getElementById("figura").value;
let html="";

if(f=="cuadrado")
html="Lado <input id='lado' type='number'>";

if(f=="rectangulo")
html="Base <input id='base' type='number'> Altura <input id='altura' type='number'>";

if(f=="circulo")
html="Radio <input id='radio' type='number'>";

if(f=="triangulo")
html="Base <input id='base' type='number'> Altura <input id='altura' type='number'>";

if(f=="rombo")
html="Diagonal mayor <input id='D' type='number'> Diagonal menor <input id='d' type='number'>";

if(f=="trapecio")
html="Base mayor <input id='B' type='number'> Base menor <input id='b' type='number'> Altura <input id='h' type='number'>";

if(f=="pentagono")
html="Lado <input id='lado' type='number'> Apotema <input id='apotema' type='number'>";

if(f=="hexagono")
html="Lado <input id='lado' type='number'> Apotema <input id='apotema' type='number'>";

document.getElementById("campos").innerHTML=html;

limpiar();

}

function calcular(){

limpiar();

let f=document.getElementById("figura").value;
let unidad=document.getElementById("unidad").value;

let area=0;
let peri=0;
let texto="";

ctx.font="16px Arial";

if(f=="cuadrado"){

let l=parseFloat(document.getElementById("lado").value);

ctx.strokeRect(220,90,120,120);
ctx.fillText("Lado "+l+" "+unidad,240,80);

area=l*l;
peri=4*l;

texto="Área = lado × lado<br>"+l+" × "+l;

}

if(f=="rectangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.strokeRect(180,100,200,120);

ctx.fillText("Base "+b+" "+unidad,250,90);
ctx.fillText("Altura "+h+" "+unidad,400,160);

area=b*h;
peri=2*(b+h);

texto="Área = base × altura<br>"+b+" × "+h;

}

if(f=="circulo"){

let r=parseFloat(document.getElementById("radio").value);

ctx.beginPath();
ctx.arc(270,160,80,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(270,160);
ctx.lineTo(350,160);
ctx.stroke();

ctx.fillText("Radio "+r+" "+unidad,290,150);

area=Math.PI*r*r;
peri=2*Math.PI*r;

texto="Área = π × r²";

}

if(f=="triangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.beginPath();
ctx.moveTo(270,70);
ctx.lineTo(150,230);
ctx.lineTo(390,230);
ctx.closePath();
ctx.stroke();

let centroBase=270;

ctx.beginPath();
ctx.moveTo(centroBase,230);
ctx.lineTo(centroBase,70);
ctx.stroke();

ctx.fillText("Base "+b+" "+unidad,250,250);
ctx.fillText("Altura "+h+" "+unidad,centroBase+10,150);

area=(b*h)/2;
peri=b+Math.sqrt((b/2)*(b/2)+h*h)*2;

texto="Área = (base × altura) / 2";

}

if(f=="rombo"){

let D=parseFloat(document.getElementById("D").value);
let d=parseFloat(document.getElementById("d").value);

ctx.beginPath();
ctx.moveTo(270,60);
ctx.lineTo(390,160);
ctx.lineTo(270,260);
ctx.lineTo(150,160);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(270,60);
ctx.lineTo(270,260);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(150,160);
ctx.lineTo(390,160);
ctx.stroke();

ctx.fillText("D "+D+" "+unidad,280,160);
ctx.fillText("d "+d+" "+unidad,240,150);

area=(D*d)/2;

peri=4*Math.sqrt((D/2)*(D/2)+(d/2)*(d/2));

texto="Área = (D × d) / 2";

}

if(f=="trapecio"){

let B=parseFloat(document.getElementById("B").value);
let b=parseFloat(document.getElementById("b").value);
let h=parseFloat(document.getElementById("h").value);

ctx.beginPath();
ctx.moveTo(170,230);
ctx.lineTo(370,230);
ctx.lineTo(330,120);
ctx.lineTo(210,120);
ctx.closePath();
ctx.stroke();

ctx.fillText("B "+B+" "+unidad,250,250);
ctx.fillText("b "+b+" "+unidad,260,110);
ctx.fillText("h "+h+" "+unidad,140,170);

area=((B+b)*h)/2;

peri=B+b+2*Math.sqrt(h*h+((B-b)/2)*((B-b)/2));

texto="Área = (B + b) × h / 2";

}

if(f=="pentagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apotema").value);

peri=5*l;
area=(peri*a)/2;

ctx.beginPath();
ctx.moveTo(270,60);
ctx.lineTo(370,130);
ctx.lineTo(330,250);
ctx.lineTo(210,250);
ctx.lineTo(170,130);
ctx.closePath();
ctx.stroke();

ctx.fillText("lado "+l+" "+unidad,380,150);
ctx.fillText("apotema "+a+" "+unidad,260,170);

texto="Área = (Perímetro × apotema) / 2";

}

if(f=="hexagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apotema").value);

peri=6*l;
area=(peri*a)/2;

ctx.beginPath();
ctx.moveTo(270,60);
ctx.lineTo(380,130);
ctx.lineTo(380,230);
ctx.lineTo(270,290);
ctx.lineTo(160,230);
ctx.lineTo(160,130);
ctx.closePath();
ctx.stroke();

ctx.fillText("lado "+l+" "+unidad,390,170);
ctx.fillText("apotema "+a+" "+unidad,260,170);

texto="Área = (Perímetro × apotema) / 2";

}

document.getElementById("areaResultado").innerHTML=area.toFixed(2)+" "+unidad+"²";
document.getElementById("periResultado").innerHTML=peri.toFixed(2)+" "+unidad;
document.getElementById("proceso").innerHTML=texto;

}

</script>

</body>
</html>
