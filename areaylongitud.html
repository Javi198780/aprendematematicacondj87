<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría Divertida</title>

<style>

body{
font-family:Arial;
background:linear-gradient(120deg,#a1c4fd,#c2e9fb);
text-align:center;
padding:20px;
}

.container{
background:white;
width:850px;
margin:auto;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

select,input,button{
padding:8px;
margin:6px;
font-size:16px;
border-radius:6px;
}

button{
background:#27ae60;
color:white;
border:none;
cursor:pointer;
}

canvas{
border:2px solid #ccc;
margin-top:15px;
border-radius:10px;
}

.proceso{
margin-top:15px;
background:#f4f6f7;
padding:15px;
border-radius:10px;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<h1>📐 Geometría para Niños</h1>

Figura

<select id="figura" onchange="camposFigura()">

<option value="">Seleccionar</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="circulo">Círculo</option>
<option value="triangulo">Triángulo</option>
<option value="rombo">Rombo</option>
<option value="trapecio">Trapecio</option>
<option value="pentagono">Pentágono</option>
<option value="hexagono">Hexágono</option>

</select>

Unidad

<select id="unidad">
<option value="cm">Centímetros</option>
<option value="m">Metros</option>
</select>

<div id="campos"></div>

<canvas id="canvas" width="500" height="300"></canvas>

<br>

<button onclick="calcular()">Calcular</button>

<div id="proceso" class="proceso"></div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function camposFigura(){

let f=document.getElementById("figura").value;
let html="";

if(f=="cuadrado")
html="Lado <input id='lado' type='number'>";

if(f=="rectangulo")
html="Base <input id='base' type='number'> Altura <input id='altura' type='number'>";

if(f=="circulo")
html="Radio <input id='radio' type='number'>";

if(f=="triangulo")
html="Base <input id='base' type='number'> Altura <input id='altura' type='number'>";

if(f=="rombo")
html="Diagonal mayor <input id='D' type='number'> Diagonal menor <input id='d' type='number'>";

if(f=="trapecio")
html="Base mayor <input id='B' type='number'> Base menor <input id='b' type='number'> Altura <input id='h' type='number'>";

if(f=="pentagono")
html="Lado <input id='lado' type='number'> Apotema <input id='apotema' type='number'>";

if(f=="hexagono")
html="Lado <input id='lado' type='number'> Apotema <input id='apotema' type='number'>";

document.getElementById("campos").innerHTML=html;

limpiar();

}

function calcular(){

limpiar();

let f=document.getElementById("figura").value;
let unidad=document.getElementById("unidad").value;
let texto="";

ctx.font="16px Arial";

if(f=="cuadrado"){

let l=parseFloat(document.getElementById("lado").value);

ctx.strokeRect(200,80,120,120);

ctx.fillText("Lado "+l+" "+unidad,210,70);

let area=l*l;

texto="Área = lado × lado<br>";
texto+=l+" × "+l+" = "+area+" "+unidad+"²";

}

if(f=="rectangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.strokeRect(170,90,200,120);

ctx.fillText("Base "+b+" "+unidad,240,80);
ctx.fillText("Altura "+h+" "+unidad,380,150);

let area=b*h;

texto="Área = base × altura<br>";
texto+=b+" × "+h+" = "+area+" "+unidad+"²";

}

if(f=="circulo"){

let r=parseFloat(document.getElementById("radio").value);

ctx.beginPath();
ctx.arc(250,150,80,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(250,150);
ctx.lineTo(330,150);
ctx.stroke();

ctx.fillText("Radio "+r+" "+unidad,260,140);

let area=Math.PI*r*r;

texto="Área = π × radio²<br>";
texto+="3.14 × "+r+"² = "+area.toFixed(2)+" "+unidad+"²";

}

if(f=="triangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.beginPath();
ctx.moveTo(250,70);
ctx.lineTo(150,220);
ctx.lineTo(350,220);
ctx.closePath();
ctx.stroke();

ctx.fillText("Base "+b+" "+unidad,230,240);
ctx.fillText("Altura "+h+" "+unidad,360,150);

let area=(b*h)/2;

texto="Área = base × altura / 2<br>";
texto+="("+b+" × "+h+") / 2 = "+area+" "+unidad+"²";

}

if(f=="rombo"){

let D=parseFloat(document.getElementById("D").value);
let d=parseFloat(document.getElementById("d").value);

ctx.beginPath();
ctx.moveTo(250,60);
ctx.lineTo(370,150);
ctx.lineTo(250,240);
ctx.lineTo(130,150);
ctx.closePath();
ctx.stroke();

ctx.beginPath();
ctx.moveTo(250,60);
ctx.lineTo(250,240);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(130,150);
ctx.lineTo(370,150);
ctx.stroke();

ctx.fillText("D "+D+" "+unidad,260,150);
ctx.fillText("d "+d+" "+unidad,220,140);

let area=(D*d)/2;

texto="Área = (D × d) / 2<br>";
texto+="("+D+" × "+d+") / 2 = "+area+" "+unidad+"²";

}

if(f=="trapecio"){

let B=parseFloat(document.getElementById("B").value);
let b=parseFloat(document.getElementById("b").value);
let h=parseFloat(document.getElementById("h").value);

ctx.beginPath();
ctx.moveTo(150,220);
ctx.lineTo(350,220);
ctx.lineTo(300,120);
ctx.lineTo(200,120);
ctx.closePath();
ctx.stroke();

ctx.fillText("B "+B+" "+unidad,230,240);
ctx.fillText("b "+b+" "+unidad,240,110);
ctx.fillText("h "+h+" "+unidad,120,160);

let area=((B+b)*h)/2;

texto="Área = (B + b) × h / 2<br>";
texto+="("+B+" + "+b+") × "+h+" / 2 = "+area+" "+unidad+"²";

}

if(f=="pentagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apotema").value);

let per=5*l;
let area=(per*a)/2;

ctx.beginPath();
ctx.moveTo(250,60);
ctx.lineTo(350,120);
ctx.lineTo(310,240);
ctx.lineTo(190,240);
ctx.lineTo(150,120);
ctx.closePath();
ctx.stroke();

ctx.fillText("lado "+l+" "+unidad,350,140);
ctx.fillText("apotema "+a+" "+unidad,240,160);

texto="Perímetro = 5 × lado = "+per+"<br>";
texto+="Área = (Perímetro × apotema) / 2<br>";
texto+="("+per+" × "+a+") / 2 = "+area+" "+unidad+"²";

}

if(f=="hexagono"){

let l=parseFloat(document.getElementById("lado").value);
let a=parseFloat(document.getElementById("apotema").value);

let per=6*l;
let area=(per*a)/2;

ctx.beginPath();
ctx.moveTo(250,60);
ctx.lineTo(350,120);
ctx.lineTo(350,220);
ctx.lineTo(250,260);
ctx.lineTo(150,220);
ctx.lineTo(150,120);
ctx.closePath();
ctx.stroke();

ctx.fillText("lado "+l+" "+unidad,360,160);
ctx.fillText("apotema "+a+" "+unidad,240,160);

texto="Perímetro = 6 × lado = "+per+"<br>";
texto+="Área = (Perímetro × apotema) / 2<br>";
texto+="("+per+" × "+a+") / 2 = "+area+" "+unidad+"²";

}

document.getElementById("proceso").innerHTML=texto;

}

</script>

</body>
</html>
