<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geometría Interactiva</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#84fab0,#8fd3f4);
text-align:center;
padding:20px;
}

.container{
background:white;
width:800px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

select,input,button{
padding:8px;
margin:6px;
font-size:16px;
}

canvas{
border:2px solid #ccc;
margin-top:10px;
border-radius:10px;
}

.proceso{
background:#f4f6f7;
padding:15px;
margin-top:15px;
border-radius:10px;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>📐 Geometría Interactiva</h1>

<select id="figura" onchange="cambiarFigura()">

<option value="">Seleccionar figura</option>
<option value="cuadrado">Cuadrado</option>
<option value="rectangulo">Rectángulo</option>
<option value="triangulo">Triángulo</option>
<option value="rombo">Rombo</option>
<option value="trapecio">Trapecio</option>
<option value="pentagono">Pentágono</option>
<option value="hexagono">Hexágono</option>
<option value="circulo">Círculo</option>

</select>

<select id="unidad">
<option value="cm">cm</option>
<option value="m">m</option>
</select>

<div id="campos"></div>

<canvas id="canvas" width="500" height="300"></canvas>

<br>

<button onclick="calcular()">Calcular</button>

<div id="proceso" class="proceso"></div>

</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function limpiar(){
ctx.clearRect(0,0,canvas.width,canvas.height);
}

function flecha(x1,y1,x2,y2){

ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();

}

function cambiarFigura(){

let f=document.getElementById("figura").value;

limpiar();

if(f=="cuadrado")
document.getElementById("campos").innerHTML="Lado <input id='lado'>";

if(f=="rectangulo")
document.getElementById("campos").innerHTML="Base <input id='base'> Altura <input id='altura'>";

if(f=="triangulo")
document.getElementById("campos").innerHTML="Base <input id='base'> Altura <input id='altura'>";

if(f=="rombo")
document.getElementById("campos").innerHTML="Diagonal mayor <input id='D'> Diagonal menor <input id='d'>";

if(f=="trapecio")
document.getElementById("campos").innerHTML="Base mayor <input id='B'> Base menor <input id='b'> Altura <input id='h'>";

if(f=="pentagono")
document.getElementById("campos").innerHTML="Lado <input id='lado'> Apotema <input id='apo'>";

if(f=="hexagono")
document.getElementById("campos").innerHTML="Lado <input id='lado'> Apotema <input id='apo'>";

if(f=="circulo")
document.getElementById("campos").innerHTML="Radio <input id='r'>";

}

function calcular(){

let f=document.getElementById("figura").value;
let unidad=document.getElementById("unidad").value;

limpiar();

let texto="";

if(f=="triangulo"){

let b=parseFloat(document.getElementById("base").value);
let h=parseFloat(document.getElementById("altura").value);

ctx.beginPath();
ctx.moveTo(150,220);
ctx.lineTo(350,220);
ctx.lineTo(250,80);
ctx.closePath();
ctx.stroke();

flecha(150,240,350,240);
ctx.fillText("Base "+b+" "+unidad,210,260);

flecha(250,220,250,80);
ctx.fillText("Altura "+h+" "+unidad,260,150);

let area=b*h/2;

texto+="Paso 1: Área = (base × altura) / 2<br>";
texto+="Paso 2: Área = ("+b+" × "+h+") /2<br>";
texto+="Paso 3: Área = "+area+" "+unidad+"²";

}

if(f=="rombo"){

let D=parseFloat(document.getElementById("D").value);
let d=parseFloat(document.getElementById("d").value);

ctx.beginPath();
ctx.moveTo(250,60);
ctx.lineTo(360,150);
ctx.lineTo(250,240);
ctx.lineTo(140,150);
ctx.closePath();
ctx.stroke();

flecha(250,60,250,240);
ctx.fillText("D "+D+" "+unidad,260,150);

flecha(140,150,360,150);
ctx.fillText("d "+d+" "+unidad,220,140);

let area=D*d/2;

texto+="Paso 1: Área = (D × d)/2<br>";
texto+="Paso 2: ("+D+" × "+d+")/2<br>";
texto+="Paso 3: "+area+" "+unidad+"²";

}

if(f=="trapecio"){

let B=parseFloat(document.getElementById("B").value);
let b=parseFloat(document.getElementById("b").value);
let h=parseFloat(document.getElementById("h").value);

ctx.beginPath();
ctx.moveTo(150,220);
ctx.lineTo(350,220);
ctx.lineTo(300,120);
ctx.lineTo(200,120);
ctx.closePath();
ctx.stroke();

ctx.fillText("B "+B+" "+unidad,230,240);
ctx.fillText("b "+b+" "+unidad,240,110);

flecha(180,220,180,120);
ctx.fillText("h "+h+" "+unidad,140,170);

let area=(B+b)*h/2;

texto+="Paso 1: Área = (B + b) × h /2<br>";
texto+="Paso 2: ("+B+" + "+b+") × "+h+" /2<br>";
texto+="Paso 3: "+area+" "+unidad+"²";

}

document.getElementById("proceso").innerHTML=texto;

}

</script>

</body>
</html>
