<!DOCTYPE html>
<html>
<head>

<title>Prismas Geométricos Interactivos</title>

<style>

body{
font-family:Arial;
background:#eaf2f8;
text-align:center;
padding:20px;
}

.container{
background:white;
width:900px;
margin:auto;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px gray;
}

h2{
color:#2c3e50;
}

input,button{
padding:8px;
margin:6px;
font-size:16px;
}

button{
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

canvas{
border:1px solid gray;
margin-top:20px;
}

.paso{
display:none;
background:#f4f6f6;
padding:15px;
margin-top:10px;
border-radius:10px;
}

.formula{
font-size:18px;
color:#1a5276;
}

.ejercicio{
background:#fcf3cf;
padding:15px;
margin-top:20px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Prismas Geométricos Interactivos</h2>

Largo
<input id="l" type="number" step="any">

Ancho
<input id="a" type="number" step="any">

Altura
<input id="h" type="number" step="any">

<br>

<button onclick="iniciar()">Calcular</button>

<button onclick="siguientePaso()">Siguiente paso</button>

<button onclick="generarEjercicio()">Modo ejercicio</button>

<canvas id="canvas" width="600" height="350"></canvas>

<div id="paso1" class="paso"></div>
<div id="paso2" class="paso"></div>
<div id="paso3" class="paso"></div>
<div id="paso4" class="paso"></div>

<div id="ejercicio" class="ejercicio"></div>

</div>

<script>

let pasoActual=0;

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

function iniciar(){

pasoActual=0;

let l=parseFloat(document.getElementById("l").value);
let a=parseFloat(document.getElementById("a").value);
let h=parseFloat(document.getElementById("h").value);

if(isNaN(l)||isNaN(a)||isNaN(h)){

alert("Ingrese todos los valores");
return;

}

let Ab=l*a;
let P=2*(l+a);
let AL=P*h;
let AT=2*Ab+AL;
let V=Ab*h;

window.valores={l,a,h,Ab,P,AL,AT,V};

document.querySelectorAll(".paso").forEach(p=>p.style.display="none");

animarPrisma();

}

function siguientePaso(){

pasoActual++;

let v=window.valores;

if(pasoActual==1){

let d=document.getElementById("paso1");

d.innerHTML=

"<h3>📘 Paso 1: Área de la base</h3>"+
"<b>Fórmula:</b> A = largo × ancho<br><br>"+

"A = "+v.l+" × "+v.a+"<br>"+
"A = "+v.Ab.toFixed(2)+" cm²";

d.style.display="block";

}

if(pasoActual==2){

let d=document.getElementById("paso2");

d.innerHTML=

"<h3>📘 Paso 2: Perímetro de la base</h3>"+
"<b>Fórmula:</b> P = 2(largo + ancho)<br><br>"+

"P = 2("+v.l+" + "+v.a+")<br>"+
"P = "+v.P.toFixed(2)+" cm";

d.style.display="block";

}

if(pasoActual==3){

let d=document.getElementById("paso3");

d.innerHTML=

"<h3>📘 Paso 3: Área lateral</h3>"+
"<b>Fórmula:</b> AL = Perímetro × altura<br><br>"+

"AL = "+v.P.toFixed(2)+" × "+v.h+"<br>"+
"AL = "+v.AL.toFixed(2)+" cm²";

d.style.display="block";

}

if(pasoActual==4){

let d=document.getElementById("paso4");

d.innerHTML=

"<h3>📘 Paso 4: Área total</h3>"+
"<b>Fórmula:</b> AT = 2 × Área base + Área lateral<br><br>"+

"AT = 2 × "+v.Ab.toFixed(2)+" + "+v.AL.toFixed(2)+"<br>"+
"AT = "+v.AT.toFixed(2)+" cm²";

d.style.display="block";

}

if(pasoActual==5){

let d=document.createElement("div");

d.className="paso";

d.innerHTML=

"<h3>📘 Paso 5: Volumen</h3>"+
"<b>Fórmula:</b> V = Área base × altura<br><br>"+

"V = "+v.Ab.toFixed(2)+" × "+v.h+"<br>"+
"V = "+v.V.toFixed(2)+" cm³";

document.querySelector(".container").appendChild(d);

d.style.display="block";

}



}

function animarPrisma(){

let x=180;
let y=200;

ctx.clearRect(0,0,600,350);

let altura=0;

let anim=setInterval(()=>{

ctx.clearRect(0,0,600,350);

ctx.strokeRect(x,y,200,100);
ctx.strokeRect(x+50,y-altura,200,100);

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+50,y-altura);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x+200,y);
ctx.lineTo(x+250,y-altura);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x,y+100);
ctx.lineTo(x+50,y+100-altura);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x+200,y+100);
ctx.lineTo(x+250,y+100-altura);
ctx.stroke();

if(altura<80){

altura+=4;

}else{

clearInterval(anim);

let v=window.valores;

ctx.fillText("L="+v.l,260,320);
ctx.fillText("A="+v.a,390,250);
ctx.fillText("H="+v.h,150,250);

}

},30);

}

function generarEjercicio(){

let l=Math.floor(Math.random()*9)+2;
let a=Math.floor(Math.random()*9)+2;
let h=Math.floor(Math.random()*9)+2;

let Ab=l*a;
let V=Ab*h;

document.getElementById("ejercicio").innerHTML=

"<h3>Ejercicio</h3>"+
"Un prisma rectangular tiene:<br>"+
"Largo = "+l+" cm<br>"+
"Ancho = "+a+" cm<br>"+
"Altura = "+h+" cm<br><br>"+
"¿Cuál es el volumen?<br><br>"+
"<input id='respuesta'>"+
"<button onclick='verificar("+V+")'>Verificar</button>";

}

function verificar(v){

let r=parseFloat(document.getElementById("respuesta").value);

if(r==v){

alert("Correcto 🎉");

}else{

alert("Incorrecto. El resultado era "+v);

}

}

</script>

</body>
</html>
